// Forge configuration. Copy this into your server's cstrike/ folder and
// add `exec forge.cfg` to the end of server.cfg (or autoexec.cfg).
//
// All values can be changed live from the server console (rcon) too.

// --- bounty / "Most Wanted" system ---
forge_bounty_streak   "4"    // kills in a row before a player becomes a bounty
forge_bounty_glow     "1"    // 1 = make the bounty glow red, 0 = off
forge_reward_armor    "50"   // armor awarded for killing the bounty

// --- per-kill bonuses ---
forge_firstblood_armor "25"  // armor for the first kill of the round
forge_headshot_armor   "10"  // armor per headshot kill
forge_adrenaline_hp    "25"  // HP healed for a kill made while at <=35 HP

echo "[Forge] forge.cfg loaded"
