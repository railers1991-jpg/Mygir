// ==========================================================================
//  Mygir — настройки сервера CS 1.6 (AMX Mod X)
//  Выполняется через exec из server.cfg или amxx.cfg:
//      exec addons/amxmodx/configs/mygir.cfg
// ==========================================================================

// ---- Classic+ : изюминки режима -----------------------------------------
mygir_perks         "1"      // 1 — перки включены
mygir_firstblood    "1"      // объявлять First Blood и давать бонус
mygir_hs_bonus      "300"    // $ за килл в голову
mygir_bounty_streak "5"      // серия убийств до статуса Most Wanted
mygir_bounty_reward "2500"   // $ тому, кто снимет Most Wanted
mygir_adrenaline    "1"      // хил за клатч-килл на низком HP

// параметры перков
mygir_vanguard_hp   "125"    // HP перка Vanguard
mygir_scout_speed   "320"    // maxspeed перка Scout
mygir_jugger_armor  "100"    // броня перка Juggernaut
mygir_phantom_grav  "0.6"    // гравитация перка Phantom (1.0 = норма)

// ---- Ranks : прогрессия --------------------------------------------------
mygir_xp_kill       "10"     // XP за убийство
mygir_xp_hs         "5"      // доп. XP за хедшот
mygir_xp_win        "15"     // XP за победный раунд
mygir_xp_base       "100"    // XP до 1-го уровня
mygir_xp_step       "50"     // прирост требуемого XP на каждый уровень

// ---- Shop : магазин ------------------------------------------------------
mygir_shop          "1"      // 1 — магазин /shop включён
